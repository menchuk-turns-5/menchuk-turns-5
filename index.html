
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Արմենի 5-ամյակը</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #f5f7ee;
  display: flex;
  justify-content: center;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 735px;
  overflow: hidden;
  font-family: "Noto Serif Armenian", serif;
  color: #222;
}

/* ORIGINAL FOOTBALL BACKGROUND */

.background {
  display: block;
  width: 100%;
  height: auto;
}

/* CURVED HEADING */

.heading {
  position: absolute;
  top: 5.5%;
  left: 7%;
  width: 86%;
  z-index: 5;
}

.heading svg {
  width: 100%;
  display: block;
  overflow: visible;
}

.curved-text {
  font-family: "Noto Serif Armenian", serif;
  font-size: 30px;
  font-weight: 700;
  fill: #21651e;
}

.gold-five {
  font-family: Georgia, serif;
  font-size: 100px;
  font-weight: 700;
  fill: #cc9327;
}

/* PHOTO INSIDE GOLDEN FRAME */

.photo-frame {
  position: absolute;
  left: 29.8%;
  top: 15.9%;
  width: 40.4%;
  height: 32.5%;
  overflow: hidden;
  border-radius: 50% 50% 0 0;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

/* FOOTBALL DECORATIONS */

.photo-decor {
  position: absolute;
  top: 29%;
  font-size: clamp(17px, 4vw, 31px);
  text-align: center;
  line-height: 1.9;
  z-index: 3;
}

.photo-decor.left {
  left: 16%;
}

.photo-decor.right {
  right: 16%;
}

/* CURVED MAIN TITLE */

.main-title {
  position: absolute;
  top: 50.5%;
  left: 7%;
  width: 86%;
}

.main-title svg {
  display: block;
  width: 100%;
  overflow: visible;
}

/* DECORATIVE GOLD LINE */

.ornament {
  position: absolute;
  top: 58.5%;
  left: 25%;
  width: 50%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #c99225;
  font-size: 17px;
}

.ornament::before,
.ornament::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #c99225;
}

/* DATE */

.date {
  position: absolute;
  top: 62%;
  left: 5%;
  width: 90%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2%;
  font-size: clamp(11px, 2.7vw, 22px);
  white-space: nowrap;
}

.date-number {
  font-family: Georgia, serif;
  font-size: clamp(34px, 8vw, 65px);
  font-weight: 700;
  color: #c99225;
  border-left: 1px solid #c99225;
  border-right: 1px solid #c99225;
  padding: 0 4%;
}

/* TIME */

.time {
  position: absolute;
  top: 69.5%;
  left: 20%;
  width: 60%;
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(18px, 3.6vw, 29px);
  font-weight: 700;
  font-style: italic;
}

/* RESTAURANT */

.restaurant {
  position: absolute;
  top: 74%;
  left: 6%;
  width: 88%;
  text-align: center;
}

.restaurant-name {
  color: #21651e;
  font-size: clamp(15px, 3.5vw, 28px);
  font-weight: 700;
}

.address {
  margin-top: 7px;
  font-size: clamp(11px, 2.4vw, 19px);
  line-height: 1.5;
}

/* LARGE CLOSING MESSAGE */

.closing {
  position: absolute;
  top: 83%;
  left: 5%;
  width: 90%;
  text-align: center;
  color: #21651e;
  font-size: clamp(19px, 4.2vw, 34px);
  font-weight: 700;
  line-height: 1.4;
}

/* GOLD HEART */

.heart {
  position: absolute;
  top: 90%;
  left: 30%;
  width: 40%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #c99225;
  font-size: 22px;
}

.heart::before,
.heart::after {
  content: "";
  height: 1px;
  background: #c99225;
  flex: 1;
}
</style>
</head>

<body>

<main class="invitation">

  <!-- BACKGROUND -->
  <img
    class="background"
    src="Pastel%20Football%20Birthday%20Frame%20Template.png"
    alt="Football Birthday Invitation"
  >

  <!-- CURVED TOP HEADING -->
  <div class="heading">

    <svg viewBox="0 0 700 140"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <path id="leftCurve"
              d="M 30,95 Q 155,45 275,72" />

        <path id="rightCurve"
              d="M 425,72 Q 545,45 670,95" />
      </defs>

      <text class="curved-text">
        <textPath href="#leftCurve"
                  startOffset="50%"
                  text-anchor="middle">
          Ես արդեն
        </textPath>
      </text>

      <text x="350"
            y="105"
            class="gold-five"
            text-anchor="middle">
        5
      </text>

      <text x="350"
            y="18"
            font-size="35"
            text-anchor="middle">
        👑
      </text>

      <text class="curved-text">
        <textPath href="#rightCurve"
                  startOffset="50%"
                  text-anchor="middle">
          տարեկան եմ
        </textPath>
      </text>

    </svg>

  </div>

  <!-- CHILD'S PHOTO -->
  <div class="photo-frame">
    <img
      src="Young%20Football%20Champion%20on%20the%20Pitch.png"
      alt="Armen"
    >
  </div>

  <!-- FOOTBALL DECORATIONS -->
  <div class="photo-decor left">
    ⭐<br>⚽<br>✨
  </div>

  <div class="photo-decor right">
    ⭐<br>⚽<br>✨
  </div>

  <!-- CURVED MAIN TITLE -->
  <div class="main-title">

    <svg viewBox="0 0 700 110"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <path id="titleCurve"
              d="M 35,80 Q 350,10 665,80" />
      </defs>

      <text
        fill="#21651e"
        font-family="Noto Serif Armenian, serif"
        font-size="39"
        font-weight="700"
        font-style="italic">

        <textPath href="#titleCurve"
                  startOffset="50%"
                  text-anchor="middle">
          Արի նշենք Ծնունդս միասին
        </textPath>

      </text>

    </svg>

  </div>

  <!-- GOLD ORNAMENT -->
  <div class="ornament">⚽</div>

  <!-- DATE -->
  <div class="date">
    <span>Հինգշաբթի</span>
    <span class="date-number">29</span>
    <span>Հոկտեմբեր</span>
  </div>

  <!-- TIME -->
  <div class="time">
    17:30
  </div>

  <!-- RESTAURANT AND ADDRESS -->
  <div class="restaurant">

    <div class="restaurant-name">
      📍 Little Chef Restaurant
    </div>

    <div class="address">
      Հասցեն՝ Առնո Բաբաջանյան 52/2
    </div>

  </div>

  <!-- CLOSING MESSAGE -->
  <div class="closing">
    Անհամբեր Սպասում եմ Քեզ
  </div>

  <!-- HEART DECORATION -->
  <div class="heart">♥</div>

</main>

</body>
</html>
