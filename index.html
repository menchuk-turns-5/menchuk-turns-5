
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Արմենի 5-ամյակը</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7ee;
  display: flex;
  justify-content: center;
}

.invitation {
  position: relative;
  width: 100%;
  max-width: 735px;
  font-family: "Noto Serif Armenian", serif;
}

/* Main invitation background */
.background {
  display: block;
  width: 100%;
  height: auto;
}

/* Child's photo inside golden arch */
.photo-frame {
  position: absolute;
  left: 29.8%;
  top: 15.9%;
  width: 40.4%;
  height: 32.5%;
  overflow: hidden;
  border-radius: 50% 50% 0 0;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* Shared text styling */
.text {
  position: absolute;
  text-align: center;
  color: #28711e;
}

/* Above the photo */
.top-text {
  top: 6.5%;
  left: 10%;
  width: 80%;
  color: #252525;
  font-size: clamp(11px, 2.7vw, 20px);
  font-weight: 500;
}

/* Large title below photo */
.main-title {
  top: 53.5%;
  left: 9%;
  width: 82%;
  font-size: clamp(19px, 4.3vw, 34px);
  font-style: italic;
  font-weight: 500;
  line-height: 1.35;
}

/* Date section */
.date {
  top: 65.5%;
  left: 9%;
  width: 82%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2%;
  color: #222;
  font-size: clamp(12px, 2.7vw, 21px);
}

.day-number {
  color: #c99122;
  font-size: clamp(30px, 6vw, 49px);
  font-weight: 700;
  border-left: 1px solid #c99122;
  border-right: 1px solid #c99122;
  padding: 0 3%;
}

.time {
  top: 72.1%;
  left: 20%;
  width: 60%;
  color: #222;
  font-size: clamp(13px, 2.6vw, 20px);
  font-style: italic;
}

/* Restaurant details */
.venue {
  top: 78.5%;
  left: 10%;
  width: 43%;
  line-height: 1.55;
}

.venue-name {
  font-size: clamp(13px, 2.7vw, 21px);
  font-weight: 700;
}

.address {
  color: #222;
  font-size: clamp(10px, 2vw, 16px);
  margin-top: 5px;
}

/* Bottom right message */
.message {
  top: 78.5%;
  right: 8%;
  width: 37%;
  font-size: clamp(13px, 2.6vw, 21px);
  font-weight: 700;
  line-height: 1.5;
}

</style>
</head>

<body>

<main class="invitation">

  <!-- Football background -->
  <img
    class="background"
    src="Pastel%20Football%20Birthday%20Frame%20Template.png"
    alt="Football Birthday Invitation"
  >

  <!-- Child's photo -->
  <div class="photo-frame">
    <img
      src="Young%20Football%20Champion%20on%20the%20Pitch.png"
      alt="Birthday Champion"
    >
  </div>

  <!-- Text above photo -->
  <div class="text top-text">
    Ես արդեն 5 տարեկան եմ
  </div>

  <!-- Main invitation title -->
  <div class="text main-title">
    Արի նշենք Ծնունդս միասին
  </div>

  <!-- Date -->
  <div class="text date">
    <span>Հինգշաբթի</span>
    <span class="day-number">29</span>
    <span>Հոկտեմբեր</span>
  </div>

  <!-- Time -->
  <div class="text time">
    17:30
  </div>

  <!-- Restaurant -->
  <div class="text venue">
    <div class="venue-name">
      Little Chef Restaurant
    </div>
    <div class="address">
      Հասցեն՝ Առնո Բաբաջանյան 52/2
    </div>
  </div>

  <!-- Invitation closing -->
  <div class="text message">
    Անհամբեր Սպասում եմ Քեզ
  </div>

</main>

</body>
</html>
