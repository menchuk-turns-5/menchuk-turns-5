
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Արմենի 5-ամյակը</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:ital,wght@0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #f5f7ee;
  overflow-x: hidden;
}

/* PAGE */

.page {
  position: relative;
  display: flex;
  justify-content: center;
  width: 100%;
  min-height: 100vh;
}

/* DESKTOP FOOTBALLS */

.outer-footballs {
  position: absolute;
  top: 0;
  bottom: 0;
  width: max(0px, calc((100% - 735px) / 2));
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.outer-footballs.left {
  left: 0;
}

.outer-footballs.right {
  right: 0;
}

.football {
  position: absolute;
  display: block;
  font-size: var(--ball-size);
  line-height: 1;
  filter: drop-shadow(0 5px 6px rgba(0,0,0,0.15));
  animation: floatFootball var(--duration)
    ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes floatFootball {
  from {
    transform: translateY(0) rotate(-10deg);
  }
  to {
    transform: translateY(-20px) rotate(12deg);
  }
}

/* INVITATION */

.invitation {
  position: relative;
  width: 100%;
  max-width: 735px;
  flex-shrink: 0;
  overflow: hidden;
  font-family: "Noto Serif Armenian", serif;
  color: #222;
  z-index: 2;
}

.background {
  display: block;
  width: 100%;
  height: auto;
}

/* MOBILE EDGE FOOTBALLS */

.mobile-footballs {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 6;
}

.mobile-ball {
  position: absolute;
  font-size: clamp(18px, 5.5vw, 29px);
  line-height: 1;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
  animation: mobileFloat var(--duration)
    ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes mobileFloat {
  from {
    transform: translateY(0) rotate(-12deg);
  }
  to {
    transform: translateY(-12px) rotate(12deg);
  }
}

/* TOP HEADING */

.heading {
  position: absolute;
  top: 5.5%;
  left: 7%;
  width: 86%;
  z-index: 5;
}

.heading svg {
  display: block;
  width: 100%;
  overflow: visible;
}

.curved-text {
  font-family: "Noto Serif Armenian", serif;
  font-size: 30px;
  font-weight: 700;
  fill: #21651e;
}

.gold-five {
  font-family: Georgia, serif;
  font-size: 100px;
  font-weight: 700;
  fill: #cc9327;
}

/* PHOTO */

.photo-frame {
  position: absolute;
  left: 29.8%;
  top: 15.9%;
  width: 40.4%;
  height: 32.5%;
  overflow: hidden;
  border-radius: 50% 50% 0 0;
  z-index: 2;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* GOLDEN STARS */

.stars {
  position: absolute;
  top: 21%;
  width: 15%;
  height: 25%;
  pointer-events: none;
  z-index: 4;
}

.stars-left {
  left: 12%;
}

.stars-right {
  right: 12%;
}

.star {
  position: absolute;
  color: #d6a12b;
  font-size: var(--size);
  line-height: 1;
  text-shadow:
    0 0 5px rgba(255,204,75,0.45),
    0 0 12px rgba(255,215,100,0.25);
  animation: floatStar var(--duration)
    ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes floatStar {
  from {
    transform: translateY(0) rotate(-8deg);
  }
  to {
    transform: translateY(-12px) rotate(10deg);
  }
}

/* MAIN TITLE */

.main-title {
  position: absolute;
  top: 50.5%;
  left: 7%;
  width: 86%;
}

.main-title svg {
  display: block;
  width: 100%;
  overflow: visible;
}

/* ORNAMENT */

.ornament {
  position: absolute;
  top: 58.5%;
  left: 25%;
  width: 50%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #c99225;
  font-size: 17px;
}

.ornament::before,
.ornament::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #c99225;
}

/* DATE */

.date {
  position: absolute;
  top: 62%;
  left: 5%;
  width: 90%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2%;
  font-size: clamp(11px,2.7vw,22px);
  white-space: nowrap;
}

.date-number {
  font-family: Georgia, serif;
  font-size: clamp(34px,8vw,65px);
  font-weight: 700;
  color: #c99225;
  border-left: 1px solid #c99225;
  border-right: 1px solid #c99225;
  padding: 0 4%;
}

/* TIME */

.time {
  position: absolute;
  top: 69.5%;
  left: 20%;
  width: 60%;
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(18px,3.6vw,29px);
  font-weight: 700;
  font-style: italic;
}

/* RESTAURANT */

.restaurant {
  position: absolute;
  top: 74%;
  left: 6%;
  width: 88%;
  text-align: center;
}

.restaurant-name {
  color: #21651e;
  font-size: clamp(15px,3.5vw,28px);
  font-weight: 700;
}

.address {
  margin-top: 7px;
  font-size: clamp(11px,2.4vw,19px);
  line-height: 1.5;
}

/* CLOSING */

.closing {
  position: absolute;
  top: 83%;
  left: 5%;
  width: 90%;
  text-align: center;
  color: #21651e;
  font-size: clamp(19px,4.2vw,34px);
  font-weight: 700;
  line-height: 1.4;
}

/* HEART */

.heart {
  position: absolute;
  top: 90%;
  left: 30%;
  width: 40%;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #c99225;
  font-size: 22px;
}

.heart::before,
.heart::after {
  content: "";
  height: 1px;
  background: #c99225;
  flex: 1;
}

/* MUSIC BUTTON */

.music-button {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 58px;
  height: 58px;
  border: 2px solid white;
  border-radius: 50%;
  background: #c99225;
  color: white;
  font-size: 26px;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 5px 18px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

#youtube-player {
  position: fixed;
  width: 200px;
  height: 200px;
  left: -9999px;
  top: 0;
  pointer-events: none;
}

/* MOBILE: FULL-WIDTH INVITATION */

@media (max-width: 735px) {

  .page {
    padding: 0;
    display: block;
  }

  .invitation {
    width: 100%;
    max-width: none;
  }

  .outer-footballs {
    display: none;
  }

  .mobile-footballs {
    display: block;
  }

  .date {
    font-size: clamp(10px, 3vw, 18px);
  }

  .date-number {
    font-size: clamp(32px, 9vw, 60px);
  }

  .restaurant-name {
    font-size: clamp(12px, 3.5vw, 24px);
  }

  .address {
    font-size: clamp(10px, 2.5vw, 17px);
  }

  .closing {
    font-size: clamp(15px, 4vw, 29px);
  }

  .music-button {
    bottom: 16px;
    right: 16px;
    width: 48px;
    height: 48px;
    font-size: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .star, .football, .mobile-ball {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="page">

<!-- DESKTOP LEFT FOOTBALLS -->

<div class="outer-footballs left" aria-hidden="true">
  <span class="football" style="top:8%;left:12%;--ball-size:75px;--duration:4s;--delay:0s">⚽</span>
  <span class="football" style="top:25%;left:30%;--ball-size:55px;--duration:5s;--delay:-2s">⚽</span>
  <span class="football" style="top:44%;left:8%;--ball-size:85px;--duration:4.5s;--delay:-1s">⚽</span>
  <span class="football" style="top:63%;left:25%;--ball-size:60px;--duration:5s;--delay:-3s">⚽</span>
  <span class="football" style="top:82%;left:10%;--ball-size:75px;--duration:4.2s;--delay:-1s">⚽</span>
</div>

<!-- DESKTOP RIGHT FOOTBALLS -->

<div class="outer-footballs right" aria-hidden="true">
  <span class="football" style="top:12%;left:15%;--ball-size:85px;--duration:4.5s;--delay:-1s">⚽</span>
  <span class="football" style="top:30%;left:35%;--ball-size:55px;--duration:5s;--delay:-2s">⚽</span>
  <span class="football" style="top:49%;left:10%;--ball-size:80px;--duration:4s;--delay:0s">⚽</span>
  <span class="football" style="top:67%;left:30%;--ball-size:60px;--duration:5.5s;--delay:-3s">⚽</span>
  <span class="football" style="top:85%;left:12%;--ball-size:75px;--duration:4.8s;--delay:-2s">⚽</span>
</div>

<main class="invitation">

  <img class="background"
    src="Pastel%20Football%20Birthday%20Frame%20Template.png"
    alt="Football Birthday Invitation">

  <!-- TOP HEADING -->

  <div class="heading">
    <svg viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="leftCurve" d="M 30,95 Q 155,45 275,72"/>
        <path id="rightCurve" d="M 425,72 Q 545,45 670,95"/>
      </defs>

      <text class="curved-text">
        <textPath href="#leftCurve" startOffset="50%" text-anchor="middle">Ես արդեն</textPath>
      </text>

      <text x="350" y="105" class="gold-five" text-anchor="middle">5</text>
      <text x="350" y="18" font-size="35" text-anchor="middle">👑</text>

      <text class="curved-text">
        <textPath href="#rightCurve" startOffset="50%" text-anchor="middle">տարեկան եմ</textPath>
      </text>
    </svg>
  </div>

  <!-- BOY'S PHOTO -->

  <div class="photo-frame">
    <img
      src="Young%20Football%20Champion%20on%20the%20Pitch.png"
      alt="Armen">
  </div>

  <!-- GOLDEN STARS LEFT -->

  <div class="stars stars-left" aria-hidden="true">
    <span class="star" style="top:5%;left:20%;--size:28px;--duration:3s;--delay:0s">★</span>
    <span class="star" style="top:30%;left:65%;--size:15px;--duration:4s;--delay:-1s">✦</span>
    <span class="star" style="top:55%;left:10%;--size:22px;--duration:3.5s;--delay:-2s">★</span>
    <span class="star" style="top:82%;left:55%;--size:12px;--duration:4.5s;--delay:-1.5s">✧</span>
  </div>

  <!-- GOLDEN STARS RIGHT -->

  <div class="stars stars-right" aria-hidden="true">
    <span class="star" style="top:12%;left:50%;--size:23px;--duration:3.8s;--delay:-1s">★</span>
    <span class="star" style="top:38%;left:10%;--size:14px;--duration:4s;--delay:-2s">✦</span>
    <span class="star" style="top:63%;left:65%;--size:28px;--duration:3.2s;--delay:-0.5s">★</span>
    <span class="star" style="top:88%;left:25%;--size:13px;--duration:4.5s;--delay:-1.5s">✧</span>
  </div>

  <!-- MAIN TITLE -->

  <div class="main-title">
    <svg viewBox="0 0 700 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="titleCurve" d="M 35,80 Q 350,10 665,80"/>
      </defs>
      <text fill="#21651e"
        font-family="Noto Serif Armenian, serif"
        font-size="39"
        font-weight="700"
        font-style="italic">
        <textPath href="#titleCurve" startOffset="50%" text-anchor="middle">
          Արի նշենք Ծնունդս միասին
        </textPath>
      </text>
    </svg>
  </div>

  <div class="ornament">⚽</div>

  <!-- DATE -->

  <div class="date">
    <span>Հինգշաբթի</span>
    <span class="date-number">29</span>
    <span>Հոկտեմբեր</span>
  </div>

  <div class="time">17:30</div>

  <!-- RESTAURANT -->

  <div class="restaurant">
    <div class="restaurant-name">📍 Little Chef Restaurant</div>
    <div class="address">Հասցեն՝ Առնո Բաբաջանյան 52/2</div>
  </div>

  <!-- CLOSING -->

  <div class="closing">Անհամբեր Սպասում եմ Քեզ</div>

  <div class="heart">♥</div>

  <!-- MOBILE FLOATING FOOTBALLS ALONG EDGES -->

  <div class="mobile-footballs" aria-hidden="true">

    <!-- LEFT EDGE -->
    <span class="mobile-ball" style="top:9%;left:0%;--duration:3.5s;--delay:0s">⚽</span>
    <span class="mobile-ball" style="top:27%;left:1%;--duration:4s;--delay:-1s">⚽</span>
    <span class="mobile-ball" style="top:46%;left:0%;--duration:3.8s;--delay:-2s">⚽</span>
    <span class="mobile-ball" style="top:67%;left:1%;--duration:4.5s;--delay:-1.5s">⚽</span>
    <span class="mobile-ball" style="top:87%;left:0%;--duration:3.7s;--delay:-2.5s">⚽</span>

    <!-- RIGHT EDGE -->
    <span class="mobile-ball" style="top:15%;right:0%;--duration:4s;--delay:-1s">⚽</span>
    <span class="mobile-ball" style="top:34%;right:1%;--duration:3.5s;--delay:-2s">⚽</span>
    <span class="mobile-ball" style="top:53%;right:0%;--duration:4.2s;--delay:0s">⚽</span>
    <span class="mobile-ball" style="top:74%;right:1%;--duration:3.8s;--delay:-1.5s">⚽</span>
    <span class="mobile-ball" style="top:92%;right:0%;--duration:4.5s;--delay:-2.5s">⚽</span>

  </div>

</main>

</div>

<!-- YOUTUBE MUSIC -->

<div id="youtube-player" aria-hidden="true"></div>

<button
  class="music-button"
  id="musicButton"
  type="button"
  aria-label="Play birthday music"
  aria-pressed="false">▶</button>

<script>
let player = null;
let musicPlaying = false;

const musicButton = document.getElementById("musicButton");

function updateMusicButton(playing) {
  musicPlaying = playing;
  musicButton.textContent = playing ? "♫" : "▶";
  musicButton.setAttribute(
    "aria-label",
    playing ? "Pause birthday music" : "Play birthday music"
  );
  musicButton.setAttribute("aria-pressed", String(playing));
}

const youtubeScript = document.createElement("script");
youtubeScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(youtubeScript);

function onYouTubeIframeAPIReady() {
  player = new YT.Player("youtube-player", {
    width: "200",
    height: "200",
    videoId: "DnmQv7T9QGs",
    playerVars: {
      autoplay: 1,
      controls: 0,
      playsinline: 1,
      rel: 0,
      origin: window.location.origin
    },
    events: {
      onReady: function(event) {
        event.target.playVideo();
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          updateMusicButton(true);
        } else if (
          event.data === YT.PlayerState.PAUSED ||
          event.data === YT.PlayerState.ENDED
        ) {
          updateMusicButton(false);
        }
      },
      onAutoplayBlocked: function() {
        updateMusicButton(false);
      }
    }
  });
}

musicButton.addEventListener("click", function() {
  if (!player || typeof player.playVideo !== "function") return;

  if (musicPlaying) {
    player.pauseVideo();
    updateMusicButton(false);
  } else {
    player.playVideo();
  }
});
</script>

</body>
</html>
