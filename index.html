
<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Armen's Birthday Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7ee;
      display: flex;
      justify-content: center;
    }

    .invitation {
      position: relative;
      width: 100%;
      max-width: 735px;
    }

    .background {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Photo inside the golden arch */
    .photo-frame {
      position: absolute;

      left: 29.8%;
      top: 15.9%;
      width: 40.4%;
      height: 32.5%;

      overflow: hidden;
      border-radius: 50% 50% 0 0;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>

<body>

  <main class="invitation">

    <!-- Original football invitation -->
    <img
      class="background"
      src="Pastel%20Football%20Birthday%20Frame%20Template.png"
      alt="Football Birthday Invitation"
    >

    <!-- Champion photo inside the frame -->
    <div class="photo-frame">
      <img
        src="Young%20Football%20Champion%20on%20the%20Pitch.png"
        alt="Young Football Champion"
      >
    </div>

  </main>

</body>
</html>
